<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/NASA-Logo-Large.jpg" alt="NASA Logo" class="logo" />
      <img src="img/nasa-worm-logo.png" alt="NASA Worm Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImagesBtn">Get Space Images</button>
    </div>

    <!-- Did You Know? section with random space facts -->
    <div class="did-you-know">
      <div class="did-you-know-content">
        <span class="did-you-know-icon">💡</span>
        <p id="spaceFactText">Did you know? Loading a fun space fact...</p>
      </div>
    </div>

    <!-- Loading message (shown while fetching images) -->
    <div id="loadingMessage" class="loading-message" style="display: none;">
      <div class="loading-spinner">🔄</div>
      <p>Loading space photos…</p>
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal for viewing full image and details -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <!-- Close button -->
      <button class="modal-close">&times;</button>
      
      <!-- Modal body with image and details -->
      <div class="modal-body">
        <!-- Large image -->
        <img id="modalImage" src="" alt="NASA Image" class="modal-image" />
        
        <!-- Image details -->
        <div class="modal-details">
          <h2 id="modalTitle">Title</h2>
          <p id="modalDate" class="modal-date"><strong>Date:</strong> </p>
          <p id="modalExplanation" class="modal-explanation">Explanation text will appear here.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
